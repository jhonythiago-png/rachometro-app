<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A1C">
<title>Rachômetro</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <img src="./logo.png" alt="Rachômetro" class="login-logo">
    <h1>Rachômetro</h1>
    <p>Entre com seu acesso de administrador</p>
    <form id="login-form">
      <input type="text" id="login-email" placeholder="Usuário (ex: jhony)" required autocapitalize="none" autocorrect="off">
      <input type="password" id="login-senha" placeholder="Senha" required>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn-primary" style="width:100%">Entrar</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen">
  <div class="topbar">
    <div class="topbar-brand">
      <img src="./logo.png" alt="Rachômetro" class="topbar-logo">
      <h1>Rachômetro</h1>
    </div>
    <button id="logout-btn">Sair</button>
  </div>

  <div class="content">

    <div id="view-elenco" class="view">
      <h2 id="elenco-titulo" style="margin-bottom:12px">Elenco</h2>
      <div id="lista-elenco"></div>
    </div>

    <div id="view-cadastro" class="view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
        <h2 id="cadastro-titulo">Novo jogador</h2>
        <button type="button" id="btn-cancelar-edicao" class="btn-ghost" style="display:none; padding:6px 12px; font-size:12px" onclick="cancelarEdicao()">Cancelar</button>
      </div>
      <label class="field-label">Nome</label>
      <input type="text" id="cadastro-nome" placeholder="Nome do jogador">

      <label class="field-label">Posições e nível</label>
      <div id="posicoes-container"></div>
      <button type="button" id="btn-add-posicao" class="btn-ghost" style="width:100%; margin-top:4px">+ Adicionar posição</button>

      <button type="button" id="btn-salvar-jogador" class="btn-primary" style="width:100%; margin-top:20px">Salvar jogador</button>
      <button type="button" id="btn-excluir-jogador" class="btn-ghost" style="display:none; width:100%; margin-top:10px; color:var(--magenta); border-color:var(--magenta)" onclick="handleExcluirJogador()">Excluir jogador</button>
    </div>

    <div id="view-dia" class="view">
      <h2 style="margin-bottom:4px">Dia de jogo</h2>
      <p id="dia-data" style="font-size:12px; color:var(--muted); margin:0 0 14px"></p>

      <div class="dia-config">
        <label class="field-label" style="margin-top:0">Jogadores por time</label>
        <input type="number" id="input-jogadores-time" min="2" max="11" value="6">
      </div>

      <div class="dia-section">
        <div class="dia-section-title">Aguardando chegada</div>
        <div id="lista-aguardando"></div>
      </div>

      <div class="dia-section">
        <div class="dia-section-title">Chegaram</div>
        <div id="lista-chegaram"></div>
      </div>

      <div class="dia-section">
        <div class="dia-section-title">Atrasados</div>
        <div id="lista-atrasados"></div>
      </div>
    </div>

    <div id="view-sorteio" class="view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px">
        <h2 id="sorteio-titulo">Sorteio</h2>
        <button type="button" id="btn-resetar-sorteio" class="btn-ghost" style="padding:6px 12px; font-size:11px; color:var(--magenta); border-color:var(--magenta)">Reiniciar dia</button>
      </div>
      <p style="font-size:12px; color:var(--muted); margin:0 0 14px">Toque em um jogador escalado pra trocar ele de time.</p>

      <div id="sorteio-status-banner"></div>
      <div id="sorteio-lista-disponiveis" style="margin-bottom:16px"></div>

      <div id="sorteio-vazio"></div>

      <div id="sorteio-times" style="display:none">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px">
          <div class="team-card team-a">
            <div class="team-header team-header-a">Time laranja <span id="time-a-media"></span></div>
            <div id="time-a-lista"></div>
          </div>
          <div class="team-card team-b">
            <div class="team-header team-header-b">Time azul <span id="time-b-media"></span></div>
            <div id="time-b-lista"></div>
          </div>
        </div>
        <p id="sorteio-anti-repeticao" style="font-size:11px; color:var(--text-dim); margin:0 0 14px"></p>
      </div>

      <button type="button" id="btn-sortear" class="btn-primary" style="width:100%; margin-bottom:10px">Sortear times</button>
      <button type="button" id="btn-nova-partida" class="btn-ghost" style="width:100%; display:none; margin-bottom:20px">Nova partida (próximo jogo)</button>

      <div id="ja-jogaram-section" style="display:none">
        <div class="section-title">Já jogaram — reativar se faltar gente</div>
        <div id="lista-ja-jogaram"></div>
      </div>
    </div>

    <div id="view-historico" class="view">
      <h2 style="margin-bottom:12px">Histórico</h2>
      <div id="historico-lista"></div>
    </div>

  </div>

  <div class="bottom-nav">
    <button id="nav-elenco" class="nav-item active">Elenco</button>
    <button id="nav-cadastro" class="nav-item">Cadastrar</button>
    <button id="nav-dia" class="nav-item">Dia de jogo</button>
    <button id="nav-sorteio" class="nav-item">Sorteio</button>
    <button id="nav-historico" class="nav-item">Histórico</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-client.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
